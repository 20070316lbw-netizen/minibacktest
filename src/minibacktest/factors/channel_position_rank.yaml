name: channel_position_rank
description: 前一日收盘价在过去 window 日最高最低区间的位置，再做同日横截面排名
params: [window]
steps:
  - id: lag
    op: shift
    input: {ref: price}
    by: {const: 1}
  - id: floor
    op: rolling_min
    input: {ref: lag}
    window: {param: window}
  - id: ceiling
    op: rolling_max
    input: {ref: lag}
    window: {param: window}
  - id: above_floor
    op: subtract
    a: {ref: lag}
    b: {ref: floor}
  - id: range
    op: subtract
    a: {ref: ceiling}
    b: {ref: floor}
  - id: position
    op: divide
    a: {ref: above_floor}
    b: {ref: range}
  - id: rank
    op: cross_section_rank
    input: {ref: position}
output: rank
